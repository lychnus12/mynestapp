name: Deploy NestJS to EC2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: EC2 접속 후 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/mynestapp

            git pull origin main

            docker stop mynestapp || true
            docker rm mynestapp || true

            docker build -t mynestapp .

            docker run -d \
              --name mynestapp \
              -p 10000:10000 \
              --restart always \
              mynestapp

            docker image prune -f